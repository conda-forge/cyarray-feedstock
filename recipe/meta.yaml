{% set name = "cyarray" %}
{% set version = "1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e2acc00ddd17ac1e94d89c659ba242c092ef9ad408c5c42ec83077226c9477d5

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - cython >=0.20
    - numpy
    - python
    - pip
  run:
    - python
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - cyarray
    - cyarray.tests
  requires:
    - pytest
  source_files:
    - cyarray/tests/*
  commands:
    - pytest --pyargs cyarray

about:
  home: https://github.com/pypr/cyarray
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'A typed, re-sizable Cython array'

extra:
  recipe-maintainers:
    - rishi9699
